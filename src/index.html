<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Log</title>
<link rel="stylesheet" href="scrollbar.css" />
<style>
  /* shadcn/ui dark theme tokens (neutral/secondary), see ui.shadcn.com */
  :root {
    --background: 240 8% 8%;
    --foreground: 0 0% 88%;
    --card: 240 7% 11%;
    --muted-foreground: 240 5% 60%;
    --secondary: 240 5% 22%;
    --secondary-foreground: 0 0% 92%;
    --border: 240 6% 22%;
    --input: 240 6% 22%;
    --danger: 0 70% 62%;
    --radius: 0.5rem;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: hsl(var(--foreground));
    /* The window itself is transparent; the visible box with rounded
       corners is drawn by .window below. */
    background: transparent;
  }

  .window {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: hsl(var(--background));
    border-radius: 12px;
    overflow: hidden;
  }

  /* No native frame: this strip is the handle for dragging the window. */
  .titlebar {
    flex-shrink: 0;
    height: 36px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    color: hsl(var(--muted-foreground));
  }

  .grip {
    margin-top: 16px;
    cursor: grab;
    user-select: none;
    line-height: 0;
  }

  .grip svg {
    width: 16px;
    height: 16px;
    pointer-events: none;
  }

  .content {
    flex: 1;
    min-height: 0;
    padding: 0 12px 12px;
    display: flex;
  }

  .composer {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid hsl(var(--input));
    border-radius: var(--radius);
    background: hsl(var(--card));
    overflow: hidden;
  }

  textarea {
    flex: 1;
    min-height: 0;
    resize: none;
    border: none;
    background: transparent;
    color: hsl(var(--foreground));
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
    outline: none;
  }

  textarea::placeholder {
    color: hsl(var(--muted-foreground));
  }

  .footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-top: 1px solid hsl(var(--border));
  }

  .counter {
    font-size: 12px;
    color: hsl(var(--muted-foreground));
    transition: color 0.15s;
  }

  .counter.ready {
    color: hsl(var(--foreground));
  }

  .counter.error {
    color: hsl(var(--danger));
  }

  button {
    background: hsl(var(--secondary));
    color: hsl(var(--secondary-foreground));
    border: none;
    border-radius: calc(var(--radius) - 2px);
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 1px 2px hsl(0 0% 0% / 0.3);
    transition: background-color 0.15s, opacity 0.15s;
  }

  button:hover:not(:disabled) {
    background: hsl(240 5% 28%);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* "Skip" is deliberately less prominent than "Save": it is a once-a-day
     escape hatch, not an equal choice. Hence the ghost style. */
  button.ghost {
    background: transparent;
    color: hsl(var(--muted-foreground));
    box-shadow: none;
  }

  button.ghost:hover:not(:disabled) {
    background: hsl(var(--secondary));
    color: hsl(var(--secondary-foreground));
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar" data-tauri-drag-region>
      <div class="grip" data-tauri-drag-region>
        <!-- lucide "grip-horizontal": grab here to move the window -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="9" r="1.4" />
          <circle cx="12" cy="9" r="1.4" />
          <circle cx="19" cy="9" r="1.4" />
          <circle cx="5" cy="15" r="1.4" />
          <circle cx="12" cy="15" r="1.4" />
          <circle cx="19" cy="15" r="1.4" />
        </svg>
      </div>
    </div>

    <div class="content">
      <div class="composer">
        <textarea id="note" autofocus></textarea>
        <div class="footer">
          <div class="counter" id="counter">0 / 50</div>
          <div class="actions">
            <button id="skip" class="ghost" hidden>Skip</button>
            <button id="save" disabled>Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
